<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Text ↔ Code Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            padding: 30px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .modes {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .mode-btn.active {
            background: #2196f3;
        }

        textarea {
            width: 100%;
            height: 300px;
            box-sizing: border-box;
            resize: vertical;

            background: #252526;
            color: #dcdcdc;

            border: 1px solid #555;
            border-radius: 8px;

            padding: 15px;
            font-size: 16px;
            font-family: Consolas, monospace;

            outline: none;
        }

        textarea:focus {
            border-color: #4fc3f7;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #2196f3;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            background: #1976d2;
        }

        #output {
            margin-top: 20px;

            min-height: 100px;

            background: #111;
            padding: 15px;
            border-radius: 8px;

            white-space: pre-wrap;
            word-break: break-all;

            font-family: Consolas, monospace;
            color: #9cdcfe;
        }

        #modeText {
            color: #aaa;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h2>📝 Text ↔ Code Converter</h2>

    <div class="modes">
        <button id="encodeBtn"
                class="mode-btn active"
                onclick="setMode('encode')">
            Text → Code
        </button>

        <button id="decodeBtn"
                class="mode-btn"
                onclick="setMode('decode')">
            Code → Text
        </button>
    </div>

    <div id="modeText">
        Chuyển Text thành dạng dùng trong code
    </div>

    <textarea
        id="input"
        placeholder="Viết nội dung ở đây..."
    ></textarea>

    <div class="buttons">
        <button onclick="convert()">
            Chuyển đổi
        </button>

        <button onclick="copyOutput()">
            Copy
        </button>

        <button onclick="clearAll()">
            Xóa
        </button>
    </div>

    <div id="output"></div>


    <script>

        let mode = "encode";


        // =========================
        // CHỌN CHẾ ĐỘ
        // =========================

        function setMode(newMode) {

            mode = newMode;

            const encodeBtn = document.getElementById("encodeBtn");
            const decodeBtn = document.getElementById("decodeBtn");
            const modeText = document.getElementById("modeText");

            if (mode === "encode") {

                encodeBtn.classList.add("active");
                decodeBtn.classList.remove("active");

                modeText.textContent =
                    "Chuyển Text thành dạng dùng trong code";

                document.getElementById("input").placeholder =
                    "Ví dụ: Xin chào!\nDòng thứ 2...";

            } else {

                decodeBtn.classList.add("active");
                encodeBtn.classList.remove("active");

                modeText.textContent =
                    "Chuyển chuỗi trong code trở lại Text";

                document.getElementById("input").placeholder =
                    'Ví dụ: Xin chào!\\nDòng thứ 2...';
            }

            document.getElementById("output").textContent = "";
        }


        // =========================
        // CHUYỂN ĐỔI
        // =========================

        function convert() {

            const input =
                document.getElementById("input").value;

            let result;


            // TEXT → CODE
            if (mode === "encode") {

                result = input
                    .replace(/\\/g, "\\\\")
                    .replace(/"/g, '\\"')
                    .replace(/\r?\n/g, "\\n");

            }


            // CODE → TEXT
            else {

                result = input
                    .replace(/\\n/g, "\n")
                    .replace(/\\"/g, '"')
                    .replace(/\\\\/g, "\\");
            }


            document.getElementById("output").textContent = result;
        }


        // =========================
        // COPY
        // =========================

        function copyOutput() {

            const output =
                document.getElementById("output").textContent;

            if (!output) {
                alert("Chưa có nội dung để copy!");
                return;
            }

            navigator.clipboard.writeText(output);

            alert("Đã copy!");
        }


        // =========================
        // XÓA
        // =========================

        function clearAll() {

            document.getElementById("input").value = "";
            document.getElementById("output").textContent = "";
        }

    </script>

</body>
</html>
